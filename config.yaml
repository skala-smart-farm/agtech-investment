# 실행 설정. 모델 이름·검색 파라미터·평가 기준 수치는 여기서만 바꾼다.

domain:
  name: AgTech
  description: "AI·센서·로봇으로 작물 재배, 병해충 진단, 수확, 축산 등 농업 생산성을 높이는 기술"
  region_priority: [KR, GLOBAL]        # 같은 순번이면 국내 먼저
  # 세부 분야: 발굴 쿼리와 시장 분석 단위 (ko: 한국어 검색어, en: 영문 검색어)
  segments:
    - {id: greenhouse, name: "스마트팜·시설원예 AI 환경제어", ko: "스마트팜 AI", en: "AI greenhouse controlled environment agriculture"}
    - {id: diagnosis, name: "작물 생육·병해충 진단 AI", ko: "작물 병해충 진단 AI", en: "AI crop disease detection"}
    - {id: robotics, name: "농업 로봇·자율주행 농기계", ko: "농업 로봇", en: "agricultural robotics autonomous tractor"}
    - {id: livestock, name: "축산 AI(가축 건강·사양 관리)", ko: "축산 AI", en: "livestock AI health monitoring"}
    - {id: agdata, name: "농업 생산 데이터 분석·예측 AI (생육·환경 데이터)", ko: "농업 데이터 플랫폼", en: "agriculture data platform AI"}

models:
  generator: gpt-4.1-mini              # 분석·보고서 작성
  judge: gpt-4.1-mini                  # 관련성 판정, 평가 문항 판정, RAG 답변 평가
  temperature: 0
  max_output_tokens:                   # 구조화 출력 상한 (반복 퇴행 방지)
    default: 2500
    report: 4000
    summarize: 1500
  price_per_mtok:                      # 비용 집계용 가격 USD / 100만 토큰 [입력, 출력]
    gpt-4.1-mini: [0.40, 1.60]
    gpt-4.1-nano: [0.10, 0.40]

embedding:
  model: nlpai-lab/KURE-v1             # Hit@4·MRR@4 측정으로 선정 (outputs/eval/retrieval_decision.md)
  query_prefix: ""
  passage_prefix: ""
  batch_size: 16
  normalize: true

rag:
  corpus_dir: data/corpus
  manifest: data/manifest.yaml
  max_total_pages: 200                 # 문서 전체 200페이지 이내
  chunk_size: 800
  chunk_overlap: 100
  top_k: 4                             # 최종 컨텍스트 조각 수
  candidate_k: 8                       # 앙상블 전에 각 검색기가 가져오는 수
  ensemble_weights: [0.4, 0.6]         # [Kiwi BM25, FAISS dense]
  min_relevant: 3                      # 최종 조각 중 관련 조각이 이 수보다 적으면 질의 재작성
  max_rewrites: 2                      # 질의 재작성 상한
  web_fallback: true                   # 재작성 후에도 부족하면 웹 검색으로 보완
  max_regenerations: 1                 # 답변이 근거와 안 맞을 때(not_grounded) 다시 쓰는 횟수 상한
  rag_recursion_limit: 25              # RAG 서브그래프 recursion_limit
  context_doc_chars: 1200              # 답변 생성·점검에 넘기는 문서 조각 최대 글자 수
  context_web_chars: 800               # 답변 생성·점검에 넘기는 웹 스니펫 최대 글자 수
  allow_direct_answer: false           # 검색 없이 바로 답하는 경로 (수치 환각 방지로 끔)

tools:
  summarize_max_chars: 6000            # 문서 요약 도구에 넣는 원문 최대 글자 수
  summarize_chunk_chars: 3000          # 긴 원문을 나눠 요약할 때 한 조각의 글자 수

search:
  max_results: 5
  news_time_range: year                # 뉴스는 최근 1년 우선
  fallback_time_range: null            # 결과가 부족할 때만 기간 제한 해제
  exclude_domains:                     # 블로그·커뮤니티·시세·유료 시장조사 홍보 페이지는 근거에서 제외
    [blog.naver.com, m.blog.naver.com, cafe.naver.com, tistory.com, brunch.co.kr, velog.io, medium.com,
     youtube.com, facebook.com, instagram.com, linkedin.com, namu.wiki, reddit.com, x.com, twitter.com,
     finance.daum.net, fdatabot.com,
     imarcgroup.com, mordorintelligence.com, mordorintelligence.kr, gminsights.com, precedenceresearch.com,
     marketsandmarkets.com, fortunebusinessinsights.com, grandviewresearch.com, researchandmarkets.com,
     alliedmarketresearch.com, expertmarketresearch.com, globenewswire.com, openpr.com, einpresswire.com,
     sphericalinsights.com, custommarketinsights.com, marketresearchfuture.com, businessresearchinsights.com,
     rootsanalysis.com, maximizemarketresearch.com, verifiedmarketresearch.com, databridgemarketresearch.com,
     coherentmarketinsights.com, marketresearch.com, futuremarketinsights.com, transparencymarketresearch.com,
     skyquestt.com, polarismarketresearch.com, zionmarketresearch.com, emergenresearch.com, stellarmr.com]
  timeout_sec: 30                      # 공급자 요청 1회 제한 시간(초)
  retries: 1                           # 일시 오류(연결 끊김·429·5xx) 재시도 횟수
  breaker_after: 3                     # 같은 공급자가 연속 N번 실패하면 이번 실행에서 끈다
  progress_every: 10                   # 실시간 검색 N회마다 진행 상황 출력

workflow:
  max_candidates_per_round: 18         # 발굴 라운드당 검증할 최대 후보 수 (= screen_kr + screen_global)
  screen_kr: 12                        # 검증 슬롯 지역별 몫 (국내)
  screen_global: 6                     # 검증 슬롯 지역별 몫 (해외)
  max_discovery_rounds: 2              # 발굴 반복 상한
  max_evaluations: 10                  # 심층 평가할 최대 스타트업 수
  stop_on_invest: false                # true 면 첫 투자 추천에서 보고서로. false 면 상한까지 평가하고 배수 1위를 고른다
  calibrate: false                     # 보정 실행(app.py --calibrate): 동종 기준 집단만 만들고 보고서는 쓰지 않음
  recursion_limit: 100                 # 메인 그래프 recursion_limit

decision:
  # Payne Scorecard: 동종 투자 유치 기업 평균 = 1.00 대비 배수
  method: payne_relative               # 6개 기준마다 동종 평균 대비 배수를 구해 가중합(M)
  threshold: 1.00                      # 투자 ⇔ M > threshold
  step: 0.5                            # 기준별 배수 c = clip(1 + step × 평균(문항 신호 − 동종 평균 신호))
  clip: [0.5, 1.5]                     # 기준별 배수 c 의 하한·상한
  founder_min_c: 1.00                  # 창업자 기준 배수가 이 값 이상이어야 투자
  reference_file: data/reference_class.json   # 동종 기준 집단 (app.py --calibrate 가 만든다)
  reference_min_n: 5                   # 기준 집단이 이 수보다 작으면 동종 평균 신호를 0 으로 둔다
  sensitivity: [1.00, 1.05, 1.10, 1.15, 1.20]   # 기준 배수 민감도
  flip_max_items: 3                    # 뒤집힘 조건(미확인 → YES 면 투자)에 쓰는 최대 문항 수
  dd_max_items: 5                      # 실사 항목 최대 수

roi:                                   # ROI 참고치 (점수에는 쓰지 않음)
  fx_krw_per_usd: 1400                 # 원화 → 달러 환산 가정
  stake_assumption: [0.10, 0.20]       # 라운드 투자자 지분율 가정
  target_multiple: 10                  # VC Method 목표 회수 배수
  stage_median_usd_m: {Seed: 1, Pre-A: 1, Series A: 7, Pre-B: 7, Series B: 14, Pre-C: 14, Series C: 14}   # 단계별 라운드 금액 중앙값($M)
  stage_median_source: "AgFunder(2026) p.13, 2025 agrifoodtech median deal size by stage"

report:
  max_pages: 10                        # 보고서 최대 쪽수
  summary_max_chars: 560               # SUMMARY 글자 수 상한
  summary_max_ratio: 0.5               # SUMMARY 높이 상한 (A4 대비)
  output_dir: outputs
  scenario: false                      # --out 실행: 제출용 파일을 만들지 않음
  max_rewrites: 2                      # 보고서 재작성 상한
  run_cost_usd: 0.6                    # 1회 실행 LLM 비용 (참고용)

cache:
  dir: replay                          # 캐시 폴더 (--fresh 면 cache_fresh/)
  llm: true                            # LLM 응답 캐시
  search: true                         # 웹 검색 결과 캐시
  embeddings: true                     # 문서 임베딩 캐시

submission:                            # 제출 파일명: RAG-Output_{campus}-{class}_{이름 가나다순}.pdf
  campus: "울산"
  class: "2반"
  team: "1조"
  members: [김가연, 김진녕, 문지후, 이준희, 정승우]
